version: "3.9"

# Frontend service for the Kanban board: nginx serves static/ as-is.
# There is deliberately no build step and no node toolchain (Q3 / NFR5) —
# the browser executes the ES modules in static/js directly.
#
# The backend service is intentionally NOT declared here: internal/ currently
# ships column handlers only and has no main package, so a backend container
# would not start. See the "Blockers" section of PR C. Once the backend binary
# lands, add it back with the commented block below and the nginx proxy_pass
# in nginx.conf will route /api/ to it.

services:
  board:
    image: nginx:1.27-alpine
    container_name: sympozium-todo-board
    ports:
      - "80:80"
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

