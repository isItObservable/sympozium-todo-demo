# nginx config for the static board.
#
# Serves static/ and never requires a build step (Q3 / NFR5).
#
# The /api/ and /health locations proxy to the backend service. That service is
# commented out in docker-compose.yml until a backend main package exists in
# internal/ (see PR C "Blockers"); until then those routes return 502 and the
# board shows its non-blocking error banner — the contract is not stubbed.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME type for native ES modules — without this the browser
    # refuses to execute the imports in static/js.
    types {
        text/html               html;
        text/css                css;
        application/javascript  js;
        application/json        json;
        image/svg+xml           svg;
    }
    default_type application/octet-stream;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Never cache the app shell / modules during a demo.
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
